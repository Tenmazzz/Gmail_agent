services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/python/Dockerfile
    volumes:
    - ./backend:/app
    environment:
      - OLLAMA_MODEL=${SSH_OLLAMA_MODEL}
      - OLLAMA_BASE_URL=${SSH_OLLAMA_BASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PYTHONPATH=/app
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    